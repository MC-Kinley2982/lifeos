name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nur ein Deployment gleichzeitig. Ein laufendes Deployment wird zu Ende geführt,
# dazwischen eingereihte Läufe werden übersprungen.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

      - name: Production-Build erstellen
        run: npm run build
        env:
          # Schaltet in vite.config.ts den Base-Pfad auf "/lifeos/" um,
          # damit alle Assets unter dem GitHub-Pages-Unterpfad korrekt geladen werden.
          GITHUB_PAGES: 'true'
          # Cloud-Sync (optional): Repository-Variablen unter Settings → Secrets and variables → Actions → Variables.
          # Ohne diese Werte wird LifeOS rein lokal gebaut.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          # Google Kalender (optional): öffentliche OAuth-Client-ID, kein Secret.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v6

      - name: Build-Ergebnis hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5
